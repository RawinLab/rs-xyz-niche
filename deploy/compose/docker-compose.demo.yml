# NICHE platform demo — internal dev deploy
#
# Serves the static `platform/` folder (same artifact GitHub Pages deploys)
# on host port 3215. NGINX Proxy Manager (see /home/dev/shared-infra/) routes
# http://niche.thuragirl.dev.rawinlab.com → 192.168.248.19:3215.
#
# Run from a checkout of this repo:
#   sudo docker compose -f deploy/compose/docker-compose.demo.yml up -d
# Update after a push to main:
#   git pull && sudo docker compose -f deploy/compose/docker-compose.demo.yml restart

services:
  niche-demo:
    image: nginx:alpine
    container_name: niche-demo-nginx
    ports:
      - "3215:80"
    volumes:
      - ../../platform:/usr/share/nginx/html:ro
    restart: unless-stopped
